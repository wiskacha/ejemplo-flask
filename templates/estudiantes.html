{% extends "base.html" %}
{% block titulo %}Estudiantes{% endblock %}

{% block contenido %}
<h1>Estudiantes</h1>
<div class="card">
    <table>
        <thead>
            <tr><th>#</th><th>Nombre</th></tr>
        </thead>
        <tbody>
            {% for e in estudiantes %}
            <tr><td>{{ loop.index }}</td><td>{{ e }}</td></tr>
            {% else %}
            <tr><td colspan="2">No hay estudiantes registrados</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
